site_name: GraftQL
site_description: SQLModel in, typed GraphQL out. Turn SQLModel definitions into a fully-typed GraphQL API.
site_url: https://lorrod.github.io/graftql/
repo_url: https://github.com/lorrod/graftql
repo_name: lorrod/graftql
edit_uri: edit/main/docs/
copyright: Copyright &copy; GraftQL contributors — MIT License

theme:
  name: material
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  language: en
  logo: assets/graftql-mark-dark.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
  - navigation.instant
  - navigation.sections
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit

nav:
- Home: index.md
- Guide:
  - Getting started: Guide/Models.md
  - Relationships: Guide/Relationships.md
  - Security: Guide/Security.md
  - Utilities: Guide/Utilities.md
- API reference:
  - Public API: api/Imports.md
  - GraftModel: api/models.md
  - GraftRouter: api/Router.md
  - DataLoaders: api/DL.md
  - Setup: api/Setup.md
- Brand: brand.md

markdown_extensions:
- attr_list
- md_in_html
- mdx_include
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ''
- pymdownx.blocks.admonition:
    types:
    - note
    - info
    - tip
    - warning
    - danger
- pymdownx.tabbed:
    alternate_style: true

extra_css:
  - stylesheets/extra.css

plugins:
- macros
- search
- mkdocstrings:
    handlers:
      python:
        paths: [.]

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/lorrod/graftql
  - icon: fontawesome/brands/python
    link: https://pypi.org/project/graftql/
