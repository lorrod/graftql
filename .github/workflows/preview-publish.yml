name: Publish preview package

on:
  workflow_run:
    workflows: ["Preview package"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: pypi-prerelease
      url: https://pypi.org/project/graftql/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-wheel
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate preview wheel metadata
        id: metadata
        env:
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: python
        run: |
          import email.parser
          import os
          from pathlib import Path
          import re
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1 or len(list(Path("dist").iterdir())) != 1:
              raise SystemExit("Expected exactly one wheel and no other files")

          wheel = wheels[0]
          if wheel.stat().st_size > 20 * 1024 * 1024:
              raise SystemExit("Preview wheel exceeds the 20 MiB limit")

          with zipfile.ZipFile(wheel) as archive:
              entries = archive.infolist()
              if len(entries) > 2_000:
                  raise SystemExit("Preview wheel contains too many entries")
              metadata_entries = [entry for entry in entries if entry.filename.endswith(".dist-info/METADATA")]
              if len(metadata_entries) != 1:
                  raise SystemExit("Expected exactly one METADATA file")
              metadata_entry = metadata_entries[0]
              if metadata_entry.file_size > 1024 * 1024:
                  raise SystemExit("Wheel METADATA exceeds the 1 MiB limit")
              metadata = email.parser.BytesParser().parsebytes(archive.read(metadata_entry))

          name = metadata.get("Name", "")
          version = metadata.get("Version", "")
          expected_suffix = f".dev{os.environ['EXPECTED_RUN_ID']}"
          if name.casefold() != "graftql":
              raise SystemExit(f"Unexpected project name: {name}")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+", version):
              raise SystemExit(f"Version is not a PEP 440 development release: {version}")
          if not version.endswith(expected_suffix):
              raise SystemExit(f"Version does not belong to the triggering run: {version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Show installation command
        env:
          PREVIEW_VERSION: ${{ steps.metadata.outputs.version }}
        run: echo "Install with \`pip install 'graftql==${PREVIEW_VERSION}'\`" >> "${GITHUB_STEP_SUMMARY}"
